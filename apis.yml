aid: advancedfarmtechnologies
name: Advanced Farm Technologies
description: >-
  Advanced Farm Technologies (brand: advanced.farm) was an agricultural robotics company founded
  in 2017 in Davis, California, building autonomous robotic harvesters for specialty crops. Its
  T-6 robotic strawberry harvester and six-armed robotic apple harvester used custom rugged stereo
  cameras and machine-learning ripeness models to identify and pick fruit alongside human crews,
  and the company sold harvesting as a service rather than selling the machines. It raised roughly
  $34M from investors including CNH Industrial, Yamaha Motor Ventures and Catapult Ventures. On
  2025-04-02 CNH Industrial acquired the company's intellectual property and assets and the
  majority of its technical team joined CNH; the company no longer operates independently. Its
  domain, advanced.farm, now returns a blanket HTTP 301 to CNH's New Holland Agriculture site.
  Advanced Farm never published a public API, developer portal, SDK or machine-readable contract.
